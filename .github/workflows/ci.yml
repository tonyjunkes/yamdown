name: CI

env:
  NODE_VERSION: 24

# Run on pushes to the default branch and on pull requests targeting it.
# Documentation is intentionally included: the README example is executable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

# Cancel in-progress runs on the same ref when a new commit lands.
# Keeps PR feedback fast and avoids burning CI minutes on stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      # Define the shared bootstrap steps once and reuse them below with YAML aliases.
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v7

      - &setup_pnpm_step
        name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version is read automatically from the `packageManager` field in package.json.

      - &setup_node_step
        name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - &install_dependencies_step
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Lint (with GitHub annotations)
        run: pnpm run lint:github

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - *checkout_step
      - *setup_pnpm_step
      - *setup_node_step
      - *install_dependencies_step

      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']
    steps:
      - *checkout_step
      - *setup_pnpm_step

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - *install_dependencies_step

      - name: Run tests
        run: pnpm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - *checkout_step
      - *setup_pnpm_step
      - *setup_node_step
      - *install_dependencies_step

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']
    steps:
      - *checkout_step
      - *setup_pnpm_step

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - *install_dependencies_step

      - name: Build package
        run: pnpm run build

      - name: Check committed JSON Schema
        run: pnpm run schema:check

      - name: Exercise installed tarball
        run: pnpm run test:package

      - name: Inspect package contents
        run: pnpm run pack:check
